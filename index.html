<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kundenlotse">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kundenlotse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
button,a,.rbtn{-webkit-tap-highlight-color:transparent}
@media (pointer:coarse){.in,textarea.in,select.in{font-size:16px}}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{color-scheme:light}
/* Layout: black icon rail fixed at the left edge; hovering it opens a white pop-up menu with labels. Working surface to the right; record pages in two columns, lists as tables scrolling in their own frame. */
:root{
  --bg:#F4F6F6; --surface:#FFFFFF; --surface-2:#F0F4F4; --ink:#0B0D0E; --muted:#5C6A6B; --line:#DCE3E3;
  --accent:#0A8A85; --accent-soft:#DDF4F2; --accent-2:#9FE1DD; --accent-ink:#04211F;
  --tiffany:#0ABAB5; --tiffany-soft:#DDF4F2; --on-tiffany:#04211F; --btn:#0B0D0E; --btn-ink:#FFFFFF;
  --rail:#0B0D0E; --rail-ink:#F3F7F7; --rail-muted:#8D9A9B; --rail-hover:rgba(255,255,255,.09); --rail-line:rgba(255,255,255,.13);
  --vio:#6A41A8; --vio-soft:#ECE4F7;
  --good:#2E7D3A; --good-soft:#E0F1E2; --warn:#8F5400; --warn-soft:#FBEBCB; --warn-fill:#D98A00; --bad:#B0352D; --bad-soft:#FAE0DD; --neu:#8C9899;
  --a1:#0ABAB5; --a2:#6B7779; --a3:#E2725B; --a4:#5866C9; --a5:#C9952B; --a6:#C7457A;
  --rw:68px;
  --font-display:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (max-width:640px){:root{--rw:56px}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0D0E; --surface:#121718; --surface-2:#1A2122; --ink:#EEF3F3; --muted:#95A4A5; --line:#263132;
  --accent:#45D6CF; --accent-soft:#113533; --accent-2:#1F5A57; --accent-ink:#03201E;
  --tiffany:#2EC9C3; --tiffany-soft:#113533; --on-tiffany:#03201E; --btn:#EEF3F3; --btn-ink:#0B0D0E;
  --rail:#000000; --rail-ink:#F3F7F7; --rail-muted:#7F8C8D; --rail-hover:rgba(255,255,255,.09); --rail-line:rgba(255,255,255,.13);
  --vio:#B99AE8; --vio-soft:#2E2442;
  --good:#63C77A; --good-soft:#163A20; --warn:#E3A648; --warn-soft:#3A2D12; --warn-fill:#E3A648; --bad:#F08077; --bad-soft:#40201F; --neu:#6F7E7F;
  --a1:#2EC9C3; --a2:#AEB9BA; --a3:#F08D78; --a4:#8E99EC; --a5:#E5BD62; --a6:#EE86AE;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D0E; --surface:#121718; --surface-2:#1A2122; --ink:#EEF3F3; --muted:#95A4A5; --line:#263132;
  --accent:#45D6CF; --accent-soft:#113533; --accent-2:#1F5A57; --accent-ink:#03201E;
  --tiffany:#2EC9C3; --tiffany-soft:#113533; --on-tiffany:#03201E; --btn:#EEF3F3; --btn-ink:#0B0D0E;
  --rail:#000000; --rail-ink:#F3F7F7; --rail-muted:#7F8C8D; --rail-hover:rgba(255,255,255,.09); --rail-line:rgba(255,255,255,.13);
  --vio:#B99AE8; --vio-soft:#2E2442;
  --good:#63C77A; --good-soft:#163A20; --warn:#E3A648; --warn-soft:#3A2D12; --warn-fill:#E3A648; --bad:#F08077; --bad-soft:#40201F; --neu:#6F7E7F;
  --a1:#2EC9C3; --a2:#AEB9BA; --a3:#F08D78; --a4:#8E99EC; --a5:#E5BD62; --a6:#EE86AE;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font-body);font-variant-numeric:tabular-nums;padding-left:calc(var(--rw) + env(safe-area-inset-left,0px))}
body.ein{padding-left:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,p{margin:0}
h2{font:700 26px/1.15 var(--font-display);text-wrap:balance;letter-spacing:-.01em}
h3{font:700 16px/1.25 var(--font-display)}
a{color:var(--accent)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}

/* rail + pop-up */
.rail{position:fixed;left:0;top:0;bottom:0;z-index:40;width:calc(var(--rw) + env(safe-area-inset-left,0px));padding:calc(12px + env(safe-area-inset-top,0px)) 0 calc(12px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px);background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
body.ein .rail,body.ein .fly{display:none}
.ricons{display:flex;flex-direction:column;gap:6px;align-items:center}
.rbtn{position:relative;width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--rail-muted);background:transparent;border:0;cursor:pointer;text-decoration:none;flex:none;padding:0}
.rbtn:hover{color:var(--rail-ink);background:var(--rail-hover)}
.rbtn.on{background:var(--tiffany);color:var(--on-tiffany)}
.rbtn.mark{background:var(--rail-ink);color:var(--rail);margin-bottom:12px}
.rbtn.mark:hover{background:var(--tiffany);color:var(--on-tiffany)}
.rbtn .dot{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--tiffany);color:var(--on-tiffany);font:600 10px/17px var(--font-mono);text-align:center;box-shadow:0 0 0 2px var(--rail)}
.rbtn.on .dot{background:var(--rail-ink);color:var(--rail)}
.rbtn.adv-b{width:36px;height:36px;border-radius:50%;font:700 12px/1 var(--font-display);letter-spacing:.02em;color:var(--rail-ink);box-shadow:inset 0 0 0 2px var(--c)}
.rbtn.adv-b.on{background:var(--rail-ink);color:var(--rail)}
.rsep{width:28px;height:1px;background:var(--rail-line);margin:8px 0;flex:none}
.rfill{flex:1 1 auto;min-height:8px}
@media (max-width:640px){.rbtn{width:40px;height:40px}.rbtn.adv-b{width:34px;height:34px}}
.fly{position:fixed;z-index:45;top:calc(10px + env(safe-area-inset-top,0px));left:calc(var(--rw) + env(safe-area-inset-left,0px) + 10px);width:min(300px,calc(100vw - var(--rw) - 20px));max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 60px rgba(0,0,0,.20),0 2px 8px rgba(0,0,0,.08);padding:14px;display:flex;flex-direction:column;gap:14px;opacity:0;visibility:hidden;transform:translateX(-8px) scale(.985);transform-origin:left top;transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s}
.fly.open{opacity:1;visibility:visible;transform:none;transition:opacity .16s ease,transform .16s ease,visibility 0s}
@media (prefers-reduced-motion:reduce){.fly,.fly.open{transition:none}}
.fhead{display:flex;gap:12px;align-items:center;padding:2px 4px 14px;border-bottom:1px solid var(--line)}
.fmark{width:38px;height:38px;border-radius:11px;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.fhead b{display:block;font:800 17px/1.15 var(--font-display);letter-spacing:-.01em}
.fhead span{font-size:12px;color:var(--muted)}
.fsec{display:flex;flex-direction:column;gap:2px}
.fsec .lab{padding:0 8px 6px}
.fitem{display:flex;align-items:center;gap:12px;padding:8px;border-radius:11px;color:var(--ink);text-decoration:none;background:none;border:0;font:inherit;text-align:left;cursor:pointer;width:100%}
.fitem svg{color:var(--muted);flex:none}
.fitem:hover{background:var(--surface-2)}
.fitem.on{background:var(--tiffany-soft)}
.fitem.on svg{color:var(--accent)}
.ft{display:flex;flex-direction:column;min-width:0;flex:1}
.ft b{font-weight:600;font-size:14px}
.ft small{font-size:12px;color:var(--muted)}
.fbadge{font:600 11px var(--font-mono);background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:99px}
.fno{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 11px var(--font-display);letter-spacing:.02em;box-shadow:inset 0 0 0 2px var(--c);flex:none}
.einbrand{display:flex;align-items:center;gap:10px}
.einbrand b{font:800 17px/1 var(--font-display)}

/* controls */
.btn{font:600 13px/1.2 var(--font-body);padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.pri:hover{background:var(--tiffany);border-color:var(--tiffany);color:var(--on-tiffany)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px;width:100%;min-width:0}
textarea.in{resize:vertical;min-height:64px;line-height:1.45}
select.in{padding-right:6px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12px;color:var(--muted);min-width:0}
.lab{font:600 11px/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
.small{font-size:12px}

/* page head */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phead p{color:var(--muted);margin-top:3px}
.eyebrow{font:600 12px/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:4px;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;min-height:30px}
.back:hover{color:var(--ink)}

/* notices */
.note{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.note.info{background:var(--accent-soft);color:var(--accent)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel>.lab{display:block;margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);border:0;padding:14px 16px;text-align:left;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px}
button.kpi{cursor:pointer}
button.kpi:hover{background:var(--surface-2)}
.kpi b{font:700 28px/1.1 var(--font-display)}
.kpi span{color:var(--muted);font-size:12px;font-weight:500}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}.kpi.good b{color:var(--good)}.kpi.acc b{color:var(--accent)}

/* bars */
.brow{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 54px;gap:10px;align-items:center;padding:5px 0}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.brow .ct{text-align:right;font:500 12px var(--font-mono);color:var(--muted)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.pcode{font:500 11px var(--font-mono);padding:2px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pcode.a{background:var(--tiffany);color:var(--on-tiffany);border-color:var(--tiffany)}
.pcode.i{border-style:dashed;border-color:var(--accent);color:var(--accent);background:transparent}

/* advisor + pills */
.adv{display:inline-flex;align-items:center;gap:6px;font-weight:600;min-width:0;white-space:nowrap}
.adv i{width:9px;height:9px;border-radius:50%;flex:none}
.adv.none{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font:600 12px/1.5 var(--font-body);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.neu{background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.vio{background:var(--vio-soft);color:var(--vio)}
.pill.ink{background:var(--ink);color:var(--surface)}
.pill.ex{background:var(--warn-soft);color:var(--warn);font-size:10px;padding:0 6px;text-transform:uppercase;letter-spacing:.06em}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font:700 16px var(--font-display)}
.link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{color:var(--accent);text-decoration-color:var(--accent)}
a.link{display:inline}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-of-type{border-top:0}
.li>div{min-width:0}
.dmini{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:46px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);flex:none}
.dmini b{font:800 17px/1 var(--font-display)}
.dmini span{font:600 9px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lrow{display:flex;gap:12px;align-items:center;min-width:0}

/* advisor cards */
.acard{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--ink)}
.ahead{display:flex;align-items:center;gap:12px}
.anum{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font:800 20px/1 var(--font-display);background:var(--ink);color:var(--surface);box-shadow:inset 0 -5px 0 var(--c);flex:none}
.ahead .t{display:flex;flex-direction:column;min-width:0}
.ahead .t span{font:600 11px/1.3 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ahead .t b{font:700 18px/1.2 var(--font-display)}
.astats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.astats div{display:flex;flex-direction:column;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.astats b{font:700 18px/1.2 var(--font-display)}
.astats span{font-size:11px;color:var(--muted);font-weight:500}
.quote{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.quote .bar{flex:1;height:8px}
.quote .bar i{background:var(--good)}

/* events */
.sect{display:flex;flex-direction:column;gap:10px}
.evcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 16px;padding:16px 18px}
.dbox{align-self:start;text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px 0 6px;background:var(--surface-2)}
.dbox b{display:block;font:800 24px/1 var(--font-display)}
.dbox span{font:600 11px/1.4 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.evbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.evtitle{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.evmeta{color:var(--muted);display:flex;gap:2px 14px;flex-wrap:wrap}
.dist{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center}
.dist .adv{font-weight:500}
.dist .adv b{font:500 12px var(--font-mono)}

/* filters + table */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
.colpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:600 12px var(--font-body);padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;min-height:30px}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-2)}
.prodleg{display:flex;gap:4px 14px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
.prodleg b{font:500 11px var(--font-mono);color:var(--ink);margin-right:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.t th,.t td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.t tr:last-child td{border-bottom:0}
.t th{background:var(--surface-2);font:600 11px/1.2 var(--font-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;padding-block:9px}
.t th:first-child,.t td:first-child{position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line)}
.t td{background:var(--surface)}
.t td:first-child{background:var(--surface)}
.t th:first-child{background:var(--surface-2)}
.t tbody tr:hover td{background:var(--surface-2)}
.th{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.th:hover,.th.on{color:var(--ink)}
.cn{display:flex;flex-direction:column;gap:1px;min-width:150px}
.cn .sub{font:400 12px var(--font-mono);color:var(--muted);white-space:nowrap}
.cn .nmrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.addr{min-width:150px;color:var(--ink)}
.addr span{display:block;color:var(--muted);font-size:12px}
.tdate{white-space:nowrap}
.tdate span{display:block;color:var(--muted);font-size:12px}
.wish{max-width:240px;min-width:160px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:12px}
.t select.in[data-f="advisorId"]{min-width:210px}
.t select.in{min-width:150px;min-height:32px;padding-block:4px;font-size:13px}

<script>
(function(){
'use strict';
const PRODUCTS=[
  {k:'du',c:'DU',n:'Dienstunfähigkeit'},{k:'re',c:'RE',n:'Rente'},{k:'vl',c:'VL',n:'Vermögenswirksame Leistungen'},
  {k:'uv',c:'UV',n:'Unfallversicherung'},{k:'kv',c:'KV',n:'Krankenversicherung mit Pflegepflicht und Anwartschaft'},
  {k:'hp',c:'PHV',n:'Privathaftpflicht'},{k:'rs',c:'RS',n:'Rechtsschutz'}];
const STATUS=[
  {k:'neu',n:'Neu',c:'neu',f:'--neu'},{k:'termin',n:'Termin vereinbart',c:'ink',f:'--ink'},{k:'beratung',n:'In Beratung',c:'acc',f:'--tiffany'},
  {k:'unterlagen',n:'Wartet auf Unterlagen',c:'warn',f:'--warn-fill'},{k:'fertig',n:'Abgeschlossen',c:'good',f:'--good'},{k:'kein',n:'Kein Interesse',c:'bad',f:'--bad'}];
const PHASES=[{k:'',n:'Noch kein Gespräch',c:'neu'},{k:'erst',n:'Erstgespräch',c:'acc'},{k:'zweit',n:'Zweitgespräch',c:'ink'},{k:'folge',n:'Folgetermin',c:'warn'}];
const QMS=[{k:'offen',n:'Offen',c:'warn'},{k:'erreicht',n:'Erreicht',c:'good'},{k:'nicht-erreicht',n:'Nicht erreicht',c:'bad'}];
const PSTATES=[{k:'',n:'–'},{k:'interesse',n:'Interesse'},{k:'aufgeschrieben',n:'Aufgeschrieben'}];
const KINDS={gross:'Großveranstaltung',beratung:'Beratungstermin'};
const NAV=[['uebersicht','Übersicht'],['kunden','Kunden'],['berater','Berater'],['sparten','Sparten'],['qm','QM-Liste'],['daten','Daten']];
const COLS=['advisors','customers'];
const COLDEFS=[
  {k:'kunde',n:'Kunde',s:'name'},{k:'adresse',n:'Adresse',s:'city'},{k:'berater',n:'Berater',s:'adv'},
  {k:'termin',n:'Termin',s:'appt'},{k:'phase',n:'Gespräch',s:'phase'},{k:'standort',n:'Standort',s:'loc'},{k:'info',n:'Veranstaltung',s:'info'},
  {k:'produkte',n:'Produkte'},{k:'aufg',n:'Aufgeschrieben',s:'written'},
  {k:'wuensche',n:'Wünsche'},{k:'status',n:'Bearbeitung',s:'status'},{k:'qm',n:'QM',s:'qm'}];
const LS='kundenlotse-lokal-v2',LSC='kundenlotse-spalten';

let S={events:[],advisors:[],customers:[]};
let M={ev:new Map(),adv:new Map(),advNo:new Map(),cust:new Map()};
let dl=true,isOwner=true,mode='local',RO=false,ready=false,pending=false,rq=false;
let route={v:'uebersicht'};
const ui={q:'',info:'',ev:'',adv:'',loc:'',phase:'',status:'',prod:'',aufg:'',qm:'',sort:{k:'appt',d:1},showCols:false,qmTab:'offen',qmAdv:'',qmEv:'',hidden:new Set()};
try{const h=JSON.parse(localStorage.getItem(LSC)||'[]');if(Array.isArray(h))ui.hidden=new Set(h);}catch(e){}

const main=document.getElementById('main'),rail=document.getElementById('rail'),fly=document.getElementById('fly'),modal=document.getElementById('modal'),toastEl=document.getElementById('toast');

/* ---------- helpers ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const dObj=s=>new Date(s+'T12:00:00');
function fd(s,style){if(!s)return '–';const d=dObj(s);if(isNaN(d))return '–';
  if(style==='long')return d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if(style==='short')return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});}
const dayDiff=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
function rel(s){const n=dayDiff(s);if(isNaN(n))return '';if(n===0)return 'heute';if(n===1)return 'morgen';if(n>1)return 'in '+n+' Tagen';if(n===-1)return 'gestern';return 'vor '+(-n)+' Tagen';}
function fts(iso){const d=new Date(iso);if(isNaN(d))return '';return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pn=k=>PRODUCTS.find(x=>x.k===k)||{k:k,c:k,n:k};
const stOf=k=>STATUS.find(s=>s.k===k)||STATUS[0];
const phOf=k=>PHASES.find(s=>s.k===(k||''))||PHASES[0];
const qmOf=k=>QMS.find(s=>s.k===k)||QMS[0];
const fullName=c=>((c.firstName||'')+' '+(c.lastName||'')).trim()||'Ohne Namen';
const sortName=c=>((c.lastName||'')+' '+(c.firstName||'')).toLowerCase();
const written=c=>PRODUCTS.some(p=>c.products[p.k]==='aufgeschrieben');
const prodsIn=(c,st)=>PRODUCTS.filter(p=>c.products[p.k]===st);
const advs=()=>S.advisors.slice().sort((a,b)=>(a.no||99)-(b.no||99)||(a.name||'').localeCompare(b.name||'','de'));
const advOf=c=>c.advisorId?M.adv.get(c.advisorId)||null:null;
const evOf=c=>c.eventId?M.ev.get(c.eventId)||null:null;
const evSorted=()=>S.events.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const evLabel=e=>e.title+' · '+fd(e.date);
const advColor=a=>a?'var(--a'+(a.colorIdx||1)+')':'var(--warn-fill)';
const advBadge=a=>a?`<span class="adv"><i style="background:${advColor(a)}"></i>${esc(a.name)}</span>`:'<span class="adv none">Ohne Berater</span>';
const pill=(o,extra)=>`<span class="pill ${o.c}">${esc(o.n)}${extra||''}</span>`;
const hasExamples=()=>COLS.some(c=>S[c].some(x=>x.example));
const pct=(a,b)=>b?Math.round(a/b*100):0;

function appts(c){const a=[];if(c.apptDate)a.push({d:c.apptDate,t:c.apptTime||'',l:'Erstgespräch',k:'erst'});if(c.appt2Date)a.push({d:c.appt2Date,t:c.appt2Time||'',l:'Zweitgespräch',k:'zweit'});return a;}
function mainAppt(c){const a=appts(c);if(!a.length)return null;const up=a.filter(x=>dayDiff(x.d)>=0).sort((x,y)=>(x.d+x.t).localeCompare(y.d+y.t));return up[0]||a.sort((x,y)=>(y.d+y.t).localeCompare(x.d+x.t))[0];}

function normCust(d,id){
  const c=Object.assign({},d,{id:id});
  if(c.firstName==null&&c.lastName==null&&c.name){const p=String(c.name).trim().split(/\s+/);c.lastName=p.length>1?p.pop():'';c.firstName=p.join(' ');c._legacy=true;}
  if(Array.isArray(c.products)){const o={};c.products.forEach(k=>{o[k]='aufgeschrieben';});c.products=o;c._legacy=true;}
  else if(!c.products||typeof c.products!=='object')c.products={};
  if(c.products.aw){const rk={interesse:1,aufgeschrieben:2};if((rk[c.products.aw]||0)>(rk[c.products.kv]||0))c.products=Object.assign({},c.products,{kv:c.products.aw});}
  if(c.qm==='erledigt')c.qm='erreicht';
  if(c.status==='bearbeitung')c.status='beratung';
  if(c.status==='wartet')c.status='unterlagen';
  if(!QMS.some(q=>q.k===c.qm))c.qm='offen';
  if(!STATUS.some(s=>s.k===c.status))c.status='neu';
  if(!Array.isArray(c.log))c.log=[];
  return c;
}
function maps(){
  M.ev=new Map(S.events.map(e=>[e.id,e]));
  M.adv=new Map(S.advisors.map(a=>[a.id,a]));
  M.advNo=new Map(S.advisors.map(a=>[a.no,a]));
  M.cust=new Map(S.customers.map(c=>[c.id,c]));
}
function infos(){return [...new Set(S.customers.map(c=>(c.eventInfo||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));}
function locations(){const s=new Set();S.events.forEach(e=>{if(e.place)s.add(e.place.trim());});S.customers.forEach(c=>{if(c.location)s.add(c.location.trim());});return [...s].filter(Boolean).sort((a,b)=>a.localeCompare(b,'de'));}

let toastT=null;
function toast(msg,keep){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastT);if(!keep)toastT=setTimeout(()=>{toastEl.hidden=true;},3200);}
function fail(e){toast('Speichern fehlgeschlagen'+(e&&e.code?' ('+e.code+')':'')+'. Bitte erneut versuchen.');}

/* ---------- local storage: browser database + optional data file ---------- */
const DBN='kundenlotse',STORE='kv',FS=!(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))&&typeof window.showSaveFilePicker==='function'&&typeof window.showOpenFilePicker==='function';
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const DEV=IOS?(/iPhone|iPod/.test(navigator.userAgent)?'iPhone':'iPad'):'Computer';
let persisted=null;
const FTYPES=[{description:'Kundenlotse-Daten',accept:{'application/json':['.json']}}];
let idb=null,fileH=null,fileOk=false,needReconnect=false,savedAt='',fileSavedAt='',lastBackup='',saveT=null,storeOk=true,pendingImport=null,pendingFile=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null);}catch(e){res(null);}});}
function idbGet(k){return new Promise(res=>{if(!idb)return res(undefined);try{const r=idb.transaction(STORE).objectStore(STORE).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined);}catch(e){res(undefined);}});}
function idbSet(k,v){return new Promise(res=>{if(!idb)return res(false);try{const tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);}catch(e){res(false);}});}
const stripCust=c=>{const o=Object.assign({},c);delete o._legacy;return o;};
const snapshot=()=>({app:'kundenlotse',version:1,savedAt:savedAt,advisors:S.advisors,customers:S.customers.map(stripCust)});
function ingestAdv(){let n=0;S.advisors.sort((a,b)=>(a.no||999)-(b.no||999)||(a.name||'').localeCompare(b.name||'')).forEach(a=>{if(!a.no)a.no=1000+(++n);});}
function applyState(j){S.advisors=Array.isArray(j.advisors)?j.advisors:[];S.customers=(Array.isArray(j.customers)?j.customers:[]).filter(c=>c&&c.id).map(c=>normCust(c,c.id));ingestAdv();savedAt=j.savedAt||'';}
function isKL(j){return j&&typeof j==='object'&&j.app==='kundenlotse'&&Array.isArray(j.customers);}
async function writeFile(snap){
  if(!fileH||!fileOk)return;
  try{const w=await fileH.createWritable();await w.write(JSON.stringify(snap,null,1));await w.close();fileSavedAt=snap.savedAt;}
  catch(e){fileOk=false;needReconnect=true;toast('Die Datendatei konnte nicht gespeichert werden. Verbinde sie unter „Daten“ neu.');}
}
async function persist(){
  clearTimeout(saveT);saveT=null;
  savedAt=new Date().toISOString();
  const snap=snapshot();
  let ok=await idbSet('state',snap);
  if(!ok){try{localStorage.setItem(LS,JSON.stringify(snap));ok=true;}catch(e){}}
  if(!ok&&storeOk)toast('Der Browser-Speicher ist nicht verfügbar. Lege unter „Daten“ eine Datendatei an.');
  storeOk=ok;
  await writeFile(snap);
  schedule();
}
function queueSave(){clearTimeout(saveT);saveT=setTimeout(persist,300);}
function flush(){if(saveT)persist();}
function lw(col,id,data,merge){
  const i=S[col].findIndex(x=>x.id===id);
  let rec=Object.assign({},merge&&i>=0?S[col][i]:{},data);
  if(col==='customers')rec=normCust(rec,id);else rec.id=id;
  if(i<0)S[col].push(rec);else S[col][i]=rec;
  if(col==='advisors')ingestAdv();
  queueSave();schedule();

function makeBalancer(ids){
  const load={},glob={};ids.forEach(i=>{load[i]=0;glob[i]=0;});
  S.customers.forEach(c=>{if(c.advisorId&&Object.prototype.hasOwnProperty.call(glob,c.advisorId))glob[c.advisorId]++;});
  return ()=>{let b=ids[0];ids.forEach(i=>{if(load[i]<load[b]||(load[i]===load[b]&&glob[i]<glob[b]))b=i;});load[b]++;glob[b]++;return b;};
}
function planDist(ids){

}

/* ---------- import ---------- */
const HMAP=[[/^vor/,'firstName'],[/^(nach|familien)/,'lastName'],[/^(name|kunde|kundenname)$/,'full'],[/(tel|handy|mobil|phone|nummer)/,'phone'],[/mail/,'email'],
  [/(stra|adress|anschrift)/,'street'],[/^(plz|postleit)/,'zip'],[/^(ort|stadt|wohnort)/,'city'],[/geburt/,'birth'],[/(beruf|arbeitgeber|dienst)/,'job'],
  [/(wunsch|wünsch)/,'wishes'],[/(notiz|bemerk)/,'note'],[/standort/,'location'],[/(veranstalt|event|herkunft|quelle)/,'eventInfo']];
function parseRows(raw){
  let lines=String(raw||'').replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return [];
  const l0=lines[0];
  const delim=l0.includes('\t')?'\t':l0.includes(';')?';':(l0.split(',').length>2?',':null);
  const split=l=>delim?l.split(delim).map(s=>s.trim().replace(/^"([\s\S]*)"$/,'$1').replace(/""/g,'"').trim()):[l.trim()];
  const hm=split(l0).map(h=>{h=h.toLowerCase();const f=HMAP.find(x=>x[0].test(h));return f?f[1]:null;});
  let map=null;
  if(hm.some(x=>x==='firstName'||x==='lastName'||x==='full')){map=hm;lines=lines.slice(1);}
  const def=['firstName','lastName','phone','street','zip','city','email'];
  return lines.map(l=>{
    const cells=split(l.replace(/^(?:[-*•]|\d+[.)])\s+/,''));const r={};
    if(!map&&cells.length===1)r.full=cells[0];
    else if(!map&&cells.length===2&&/\d{4,}/.test(cells[1].replace(/\s/g,''))){r.full=cells[0];r.phone=cells[1];}
    else (map||def).forEach((f,i)=>{if(f&&cells[i])r[f]=cells[i];});
    if(r.full&&!r.firstName&&!r.lastName){
      if(r.full.includes(',')){const p=r.full.split(',');r.lastName=p[0].trim();r.firstName=p.slice(1).join(',').trim();}
      else{const p=r.full.split(/\s+/);r.lastName=p.length>1?p.pop():'';r.firstName=p.join(' ');}
    }
    delete r.full;return r;
  }).filter(r=>r.firstName||r.lastName);
}
async function addAttendees(form){
  const rows=parseRows(form.elements.names.value),auto=form.elements.auto&&form.elements.auto.checked,loc=String(form.elements.loc.value||'').trim(),info=String(form.elements.info.value||'').trim();
  const key=(n,ph)=>(n+'|'+String(ph||'').replace(/\D/g,'')).toLowerCase();
  const have=new Set(S.customers.map(c=>key(fullName(c),c.phone)));
  const add=[];let dup=0;
  rows.forEach(r=>{const k=key(((r.firstName||'')+' '+(r.lastName||'')).trim(),r.phone);if(have.has(k)){dup++;return;}have.add(k);add.push(r);});
  if(!add.length){toast(dup?'Alle Namen sind bereits erfasst.':'Keine Namen gefunden.');return;}
  const ids=advs().map(a=>a.id),pick=(auto&&ids.length)?makeBalancer(ids):null;
  closeModal();toast(add.length+' Kunden werden angelegt …',true);
  const base=Date.now();
  for(let i=0;i<add.length;i++){
    const advId=pick?pick():'';const d=newCust(Object.assign(loc?{location:loc}:{},info?{eventInfo:info}:{},add[i],{createdAt:new Date(base+i).toISOString()}),'',advId);d.log[d.log.length-1].t='Angelegt per Listenimport';
    if(advId)d.log.unshift({d:new Date(base+i).toISOString(),t:fieldLog('advisorId',advId)});
    await put('customers',uid('c'),d);
  }
  toast(add.length+' Kunden angelegt'+(pick?' und verteilt':'')+(dup?', '+dup+' Duplikate übersprungen':'')+'.');
}

const opts=(list,sel,empty)=>(empty!=null?`<option value="">${esc(empty)}</option>`:'')+list.map(x=>{const v=x.k!=null?x.k:x.id;return `<option value="${esc(v)}"${String(v)===String(sel||'')?' selected':''}>${esc(x.n||x.name||x.label)}</option>`;}).join('');
const evOpts=(sel,empty)=>opts(evSorted().map(e=>({id:e.id,label:evLabel(e)})),sel,empty);
function advOpts(sel,empty,withNone){return (empty!=null?`<option value="">${esc(empty)}</option>`:'')+(withNone?`<option value="none"${sel==='none'?' selected':''}>Ohne Berater</option>`:'')+opts(advs().map(a=>({id:a.id,name:'Berater '+a.no+' · '+a.name})),sel);}
const goAttr=(v,f)=>`data-act="goto" data-go="${esc(JSON.stringify({v:v,f:f||{}}))}"`;
const custLink=c=>`<a class="link" href="#kunde-${esc(c.id)}">${esc(fullName(c))}</a>`;
const exTag=x=>x.example?' <span class="pill ex">Beispiel</span>':'';

function stats(list){
  return {n:list.length,erst:list.filter(c=>c.phase==='erst').length,zweit:list.filter(c=>c.phase==='zweit'||c.phase==='folge').length,
    w:list.filter(written).length,qo:list.filter(c=>c.qm==='offen').length,qe:list.filter(c=>c.qm==='erreicht').length,qn:list.filter(c=>c.qm==='nicht-erreicht').length,
    wk:list.reduce((n,c)=>n+appts(c).filter(a=>{const d=dayDiff(a.d);return d>=0&&d<=7;}).length,0),
    pa:list.reduce((n,c)=>n+prodsIn(c,'aufgeschrieben').length,0)};
}
function statusBars(rows){
  const max=Math.max(1,...rows.map(r=>r.list.length));
  return rows.map(r=>{const t=r.list.length;
    const segs=STATUS.map(s=>{const k=r.list.filter(c=>c.status===s.k).length;return k?`<i style="width:${k/t*100}%;background:var(${s.f})" title="${esc(s.n)}: ${k}"></i>`:'';}).join('');
    return `<div class="brow"><span class="nm">${r.label}</span><div style="width:${t/max*100}%;min-width:${t?'6px':'0'}"><div class="bar">${segs}</div></div><span class="ct">${t}</span></div>`;}).join('')+
    '<div class="legend">'+STATUS.map(s=>`<span><i style="background:var(${s.f})"></i>${s.n}</span>`).join('')+'</div>';
}
function spartenBars(list,clickAdv){
  const rows=PRODUCTS.map(p=>({p:p,a:list.filter(c=>c.products[p.k]==='aufgeschrieben').length,i:list.filter(c=>c.products[p.k]==='interesse').length}));
  const max=Math.max(1,...rows.map(r=>r.a+r.i));
  return rows.map(r=>{const t=r.a+r.i;
    return `<div class="brow"><span class="nm" title="${esc(r.p.n)}"><span class="pcode">${r.p.c}</span> ${esc(r.p.n.split(' ')[0])}</span><div style="width:${t/max*100}%;min-width:${t?'6px':'0'}"><div class="bar">${r.a?`<i style="width:${r.a/t*100}%;background:var(--tiffany)"></i>`:''}${r.i?`<i style="width:${r.i/t*100}%;background:var(--accent-2)"></i>`:''}</div></div><span class="ct">${r.a}${r.i?' +'+r.i:''}</span></div>`;}).join('')+
    '<div class="legend"><span><i style="background:var(--tiffany)"></i>Aufgeschrieben</span><span><i style="background:var(--accent-2)"></i>Interesse</span></div>';
}
function upcoming(list,withEvents,n){
  const items=[];
  list.forEach(c=>appts(c).forEach(a=>{if(dayDiff(a.d)>=0)items.push({d:a.d,t:a.t,c:c,l:a.l});}));
  if(withEvents)S.events.forEach(e=>{if(dayDiff(e.date)>=0)items.push({d:e.date,t:e.time||'',e:e});});
  items.sort((x,y)=>(x.d+x.t).localeCompare(y.d+y.t));
  return items.slice(0,n||8);
}
function apptList(items,ro){
  if(!items.length)return '<p class="muted">Keine anstehenden Termine.</p>';
  return items.map(x=>{const d=dObj(x.d);
    const box=`<span class="dmini"><b>${d.getDate()}</b><span>${d.toLocaleDateString('de-DE',{month:'short'}).replace('.','')}</span></span>`;
    if(x.e){const cnt=S.customers.filter(c=>c.eventId===x.e.id).length;
      return `<div class="li"><div class="lrow">${box}<div><b>${esc(x.e.title)}</b>${exTag(x.e)}<div class="muted small">${fd(x.d,'short')}${x.t?', '+esc(x.t)+' Uhr':''} · ${esc(KINDS[x.e.kind]||'Termin')}${x.e.place?' · '+esc(x.e.place):''}</div></div></div><span class="pill neu">${cnt} Kunden</span></div>`;}
    const a=advOf(x.c);
    return `<div class="li"><div class="lrow">${box}<div>${ro?'<b>'+esc(fullName(x.c))+'</b>':custLink(x.c)}<div class="muted small">${fd(x.d,'short')}${x.t?', '+esc(x.t)+' Uhr':''}${x.c.location?' · '+esc(x.c.location):''}${!ro&&a?' · '+esc(a.name):''}</div></div></div>${pill({n:x.l,c:x.l==='Erstgespräch'?'acc':'ink'})}</div>`;
  }).join('');
}

/* ----- table ----- */
const SORTS={name:c=>sortName(c),city:c=>(c.city||'~').toLowerCase(),adv:c=>{const a=advOf(c);return a?String(a.no).padStart(3,'0'):'zzz';},
  appt:c=>{const a=mainAppt(c);return a?(dayDiff(a.d)>=0?'0':'1')+(dayDiff(a.d)>=0?a.d+a.t:String(99999999-Number(a.d.replace(/-/g,'')))):'9';},
  phase:c=>({erst:1,zweit:2,folge:3}[c.phase]||9),loc:c=>(c.location||'~').toLowerCase(),info:c=>(c.eventInfo||'~').toLowerCase(),ev:c=>{const e=evOf(c);return e?e.date:'9999';},
  written:c=>written(c)?0:1,status:c=>STATUS.findIndex(s=>s.k===c.status),qm:c=>QMS.findIndex(s=>s.k===c.qm)};
function sortList(list){const f=SORTS[ui.sort.k]||SORTS.name,d=ui.sort.d;return list.slice().sort((a,b)=>{const x=f(a),y=f(b);return (x<y?-1:x>y?1:0)*d||sortName(a).localeCompare(sortName(b),'de');});}
function custTable(list,o){

    kunde:c=>`<div class="cn"><div class="nmrow">${o.ro?'<b>'+esc(fullName(c))+'</b>':custLink(c)}${exTag(c)}</div>${c.phone?`<span class="sub">${esc(c.phone)}</span>`:''}${c.email?`<span class="sub">${esc(c.email)}</span>`:''}</div>`,
    adresse:c=>(c.street||c.zip||c.city)?`<div class="addr">${esc(c.street||'')}<span>${esc([c.zip,c.city].filter(Boolean).join(' '))}</span></div>`:'<span class="muted">–</span>',
    berater:c=>ro?advBadge(advOf(c)):`<select class="in" data-f="advisorId" data-id="${esc(c.id)}" aria-label="Berater für ${esc(fullName(c))}" style="border-left:4px solid ${advColor(advOf(c))}">${advOpts(c.advisorId||'','Ohne Berater')}</select>`,
    termin:c=>{const a=mainAppt(c);return a?`<div class="tdate">${fd(a.d,'short')}${a.t?', '+esc(a.t):''}<span>${rel(a.d)}</span></div>`:'<span class="muted">–</span>';},
    phase:c=>ro?(c.phase?pill(phOf(c.phase)):'<span class="muted">–</span>'):`<select class="in" data-f="phase" data-id="${esc(c.id)}" aria-label="Gespräch">${opts(PHASES,c.phase||'')}</select>`,
    standort:c=>c.location?esc(c.location):'<span class="muted">–</span>',
    info:c=>c.eventInfo?`<div style="min-width:130px">${esc(c.eventInfo)}</div>`:'<span class="muted">–</span>',
    produkte:c=>`<div class="pcs">${PRODUCTS.map(p=>{const s=c.products[p.k]||'';const cls=s==='aufgeschrieben'?'a':s==='interesse'?'i':'';
      if(ro)return s?`<span class="pcode ${cls}" title="${esc(p.n)}: ${s==='aufgeschrieben'?'aufgeschrieben':'Interesse'}">${p.c}</span>`:'';
      return `<button type="button" class="pc ${cls}" data-act="cprod" data-id="${esc(c.id)}" data-k="${p.k}" title="${esc(p.n)}: ${s==='aufgeschrieben'?'aufgeschrieben':s==='interesse'?'Interesse':'nicht gewählt'}. Klicken zum Wechseln.">${p.c}</button>`;}).join('')||'<span class="muted">–</span>'}</div>`,
    aufg:c=>written(c)?`<span class="pill good">Ja${c.writtenDate?' · '+fd(c.writtenDate).slice(0,6):''}</span>`:'<span class="pill neu">Nein</span>',
    wuensche:c=>c.wishes?`<div class="wish" title="${esc(c.wishes)}">${esc(c.wishes)}</div>`:'<span class="muted">–</span>',
    status:c=>{const s=stOf(c.status);return ro?pill(s):`<select class="in" data-f="status" data-id="${esc(c.id)}" aria-label="Bearbeitung" style="color:var(${s.f==='--warn-fill'?'--warn':s.f==='--tiffany'?'--accent':s.f});border-color:var(${s.f})">${opts(STATUS,c.status)}</select>`;},
    qm:c=>{const q=qmOf(c.qm);return ro?pill(q,c.attempts&&c.qm!=='erreicht'?' · '+c.attempts+'x':''):`<select class="in" data-f="qm" data-id="${esc(c.id)}" aria-label="QM" style="color:var(--${q.c==='warn'?'warn':q.c});border-color:var(--${q.c==='warn'?'warn-fill':q.c})">${opts(QMS,c.qm)}</select>`;}
  };
  return `<div class="tw"><table class="t"><thead><tr>${head}</tr></thead><tbody>${sortList(list).map(c=>'<tr>'+cols.map(col=>'<td>'+cell[col.k](c)+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`;

/* ----- Kunden ----- */
function filteredCust(){
  const q=ui.q.trim().toLowerCase();
  return S.customers.filter(c=>{
    if(q&&![fullName(c),c.phone,c.email,c.city,c.street,c.zip,c.wishes,c.eventInfo,c.location].join(' ').toLowerCase().includes(q))return false;
    if(ui.ev&&c.eventId!==ui.ev)return false;
    if(ui.adv==='none'){if(advOf(c))return false;}else if(ui.adv&&c.advisorId!==ui.adv)return false;
    if(ui.loc&&(c.location||'')!==ui.loc)return false;
    if(ui.info&&(c.eventInfo||'')!==ui.info)return false;
    if(ui.phase==='none'){if(c.phase)return false;}else if(ui.phase&&c.phase!==ui.phase)return false;
    if(ui.status&&c.status!==ui.status)return false;
    if(ui.prod==='none'){if(PRODUCTS.some(p=>c.products[p.k]))return false;}
    else if(ui.prod){const [st,k]=ui.prod.split(':');if(c.products[k]!==(st==='a'?'aufgeschrieben':'interesse'))return false;}
    if(ui.aufg==='ja'&&!written(c))return false;if(ui.aufg==='nein'&&written(c))return false;
    if(ui.qm&&c.qm!==ui.qm)return false;
    return true;
  });
}

}

  h+='<div class="tabs" role="group" aria-label="QM-Status">'+tabs.map(t=>`<button type="button" data-act="qm-tab" data-v="${t[0]}" aria-pressed="${tab===t[0]}">${t[1]}<b>${t[2]}</b></button>`).join('')+'</div>';
  h+=`<div class="filters" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))"><select class="in" id="q-adv" data-filter="qmAdv" aria-label="Berater">${advOpts(ui.qmAdv,'Alle Berater',true)}</select></div>`;
  if(!list.length)return h+`<div class="list"><div class="empty"><b>${tab==='offen'?'Nichts mehr offen':'Keine Einträge'}</b><span>${tab==='offen'?'Alle Kunden in dieser Auswahl wurden angerufen.':'In dieser Ansicht gibt es nichts anzuzeigen.'}</span></div></div>`;
  h+='<div class="list">'+list.map(c=>{const a=advOf(c),e=evOf(c),q=c.qm;
    const btns=q==='erreicht'?`<button class="btn sm" data-act="qm" data-id="${esc(c.id)}" data-v="offen">Wieder öffnen</button>`:`<button class="btn sm good" data-act="qm" data-id="${esc(c.id)}" data-v="erreicht">Erreicht</button><button class="btn sm" data-act="qm" data-id="${esc(c.id)}" data-v="nicht-erreicht">${q==='nicht-erreicht'?'Wieder nicht erreicht':'Nicht erreicht'}</button>`;
    const pr=PRODUCTS.filter(p=>c.products[p.k]).map(p=>`<span class="pcode ${c.products[p.k]==='aufgeschrieben'?'a':'i'}" title="${esc(p.n)}">${p.c}</span>`).join('');
    return `<article class="qcard"><div class="qwho"><div class="nmrow" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${custLink(c)}${exTag(c)}</div>${c.phone?`<span class="tel">${esc(c.phone)}</span>`:'<span class="muted">Keine Nummer hinterlegt</span>'}
      <div class="meta">${advBadge(a)}${c.city?'<span>'+esc(c.city)+'</span>':''}${c.eventInfo?'<span>'+esc(c.eventInfo)+'</span>':''}${c.phase?'<span>'+phOf(c.phase).n+'</span>':''}</div>${pr?'<div class="pcs" style="min-width:0">'+pr+'</div>':''}</div>
      <div class="qstate"><div class="info">${pill(qmOf(q))}<span>Versuche: ${c.attempts||0}</span><span>Zuletzt: ${c.qmDate?fd(c.qmDate):'noch nie'}</span></div>
      <textarea class="in" id="qn-${esc(c.id)}" data-hold data-f="qmNote" data-id="${esc(c.id)}" rows="2" placeholder="Notiz zum Gespräch" aria-label="QM-Notiz für ${esc(fullName(c))}">${esc(c.qmNote||'')}</textarea></div>
      <div class="qact wr">${btns}</div></article>`;}).join('')+'</div>';
  return h;
}

/* ---------- modals ---------- */
function openModal(html,focusSel){
  modal.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';modal.hidden=false;document.body.style.overflow='hidden';
  const f=modal.querySelector(focusSel||'input:not([type=file]),select,textarea');if(f)setTimeout(()=>f.focus(),30);
}
function closeModal(){modal.hidden=true;modal.innerHTML='';document.body.style.overflow='';}
const foot=(extra,label)=>`<div class="foot">${extra||''}<span class="spacer"></span><button type="button" class="btn" data-act="close-modal">Abbrechen</button><button type="submit" class="btn pri">${label||'Speichern'}</button></div>`;
function mImport(){
  const n=advs().length;
  openModal(`<h2>Kundenliste einfügen</h2><form data-form="attendees">
    <div class="hint">Kopiere die Zeilen direkt aus Excel hier hinein. Mit Kopfzeile werden die Spalten erkannt: <code>Vorname</code> <code>Nachname</code> <code>Telefon</code> <code>E-Mail</code> <code>Straße</code> <code>PLZ</code> <code>Ort</code> <code>Geburtsdatum</code> <code>Beruf</code> <code>Standort</code> <code>Veranstaltung</code> <code>Wünsche</code>. Ohne Kopfzeile gilt diese Reihenfolge: Vorname, Nachname, Telefon, Straße, PLZ, Ort, E-Mail. Eine reine Namensliste geht auch.</div>
    <label class="f">Kunden<textarea class="in" id="imp-names" name="names" rows="9" required placeholder="Vorname&#9;Nachname&#9;Telefon&#9;Straße&#9;PLZ&#9;Ort"></textarea></label>
    <label class="f">Oder CSV-Datei wählen<input class="in" type="file" id="imp-file" accept=".csv,.txt,text/csv,text/plain"></label>
    <div class="prev" id="imp-prev"></div>
    <div class="frow"><label class="f">Veranstaltung für alle (optional)<input class="in" name="info" list="dl-info" autocomplete="off" placeholder="z. B. Großveranstaltung 22.10."></label><label class="f">Standort für alle (optional)<input class="in" name="loc" list="dl-loc" autocomplete="off" placeholder="z. B. Hauptstelle"></label></div>
    ${n?`<label class="chk"><input type="checkbox" name="auto" checked><span>Gleich gleichmäßig auf alle ${n} Berater verteilen</span></label>`:'<p class="note">Es sind noch keine Berater angelegt. Du kannst später verteilen.</p>'}
    <p class="muted small">Kunden, die mit gleichem Namen und gleicher Telefonnummer schon erfasst sind, werden übersprungen.</p>
    ${foot('','Kunden anlegen')}</form>`);
}
function updatePreview(){
  const ta=document.getElementById('imp-names'),pv=document.getElementById('imp-prev');if(!ta||!pv)return;
  const rows=parseRows(ta.value);
  if(!rows.length){pv.innerHTML=ta.value.trim()?'<span>Keine Namen erkannt.</span>':'';return;}
  pv.innerHTML=`<b>${rows.length} Kunden erkannt</b>`+rows.slice(0,4).map(r=>`<span>${esc([r.firstName,r.lastName].filter(Boolean).join(' '))}${r.phone?' · '+esc(r.phone):''}${r.city?' · '+esc([r.zip,r.city].filter(Boolean).join(' ')):''}${r.email?' · '+esc(r.email):''}</span>`).join('')+(rows.length>4?`<span>… und ${rows.length-4} weitere</span>`:'');
}
function mDistribute(){
  const A=advs();
  if(!A.length){toast('Lege zuerst Berater an.');return;}
  const open=S.customers.filter(c=>!advOf(c)).length;
  if(!open){toast('Alle Kunden haben bereits einen Berater.');return;}
  openModal(`<h2>Kunden verteilen</h2><p class="muted">${open} Kunden haben noch keinen Berater.</p><form data-form="distribute">
    <div class="lab">Wer nimmt Kunden?</div>${A.map(a=>`<label class="chk"><input type="checkbox" name="adv" value="${esc(a.id)}" checked><span class="adv"><i style="background:${advColor(a)}"></i>Berater ${a.no} · ${esc(a.name)}</span></label>`).join('')}
    <p class="muted small">Verteilt reihum, sodass jeder Berater gleich viele neue Kunden bekommt. Bei Gleichstand ist zuerst dran, wer insgesamt weniger Kunden hat.</p>${foot('','Verteilen')}</form>`);
}
function mNewCust(){
  openModal(`<h2>Kunde hinzufügen</h2><form data-form="newcust">
    <div class="frow"><label class="f">Vorname<input class="in" name="firstName" required></label><label class="f">Nachname<input class="in" name="lastName"></label></div>
    <div class="frow"><label class="f">Telefon<input class="in" name="phone" inputmode="tel"></label><label class="f">E-Mail<input class="in" type="email" name="email"></label></div>
    <div class="frow"><label class="f">Veranstaltung<input class="in" name="eventInfo" list="dl-info" autocomplete="off"></label><label class="f">Standort<input class="in" name="location" list="dl-loc" autocomplete="off"></label></div><div class="frow"><label class="f">Berater<select class="in" name="advisorId">${advOpts(ui.adv&&ui.adv!=='none'?ui.adv:'','Ohne Berater')}</select></label></div>
    <p class="muted small">Alle weiteren Angaben trägst du danach in der Kundenakte ein.</p>${foot('','Anlegen und Akte öffnen')}</form>`);
}

/* ---------- interaction ---------- */
function armed(btn,txt){
  if(btn.dataset.armed)return true;
  btn.dataset.armed='1';btn.dataset.orig=btn.textContent;btn.textContent=txt;
  setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=btn.dataset.orig;}},4000);
  return false;
}
function resetF(){ui.q='';ui.info='';ui.ev='';ui.adv='';ui.loc='';ui.phase='';ui.status='';ui.prod='';ui.aufg='';ui.qm='';}
const WRITE={wipe:1,'do-restore':1,'create-file':1,'open-file':1,qm:1,cprod:1,sprod:1,'new-cust':1,import:1,distribute:1,'color-adv':1,'del-adv':1,'rm-examples':1,'del-cust':1};
document.addEventListener('click',e=>{
  if(fly.classList.contains('open')&&!rail.contains(e.target)&&(!fly.contains(e.target)||e.target.closest('a,button')))setFly(false);
  const t=e.target.closest('[data-act]');
  if(!t){if(e.target===modal)closeModal();return;}
  const act=t.dataset.act,id=t.dataset.id,c=id?M.cust.get(id):null;
  if((RO||route.v==='einsicht')&&WRITE[act])return;
  switch(act){
    case 'goto':{const g=JSON.parse(t.dataset.go);resetF();ui.qmAdv='';ui.qmEv='';Object.keys(g.f||{}).forEach(k=>{ui[k]=g.f[k];});go(g.v);break;}
    case 'qm':if(c)setQM(c,t.dataset.v);break;
    case 'cprod':if(c)cycleProduct(c,t.dataset.k);break;
    case 'sprod':if(c)setProduct(c,t.dataset.k,t.dataset.v);break;
    case 'sort':{const k=t.dataset.k;ui.sort=ui.sort.k===k?{k:k,d:-ui.sort.d}:{k:k,d:1};render();break;}
    case 'toggle-cols':ui.showCols=!ui.showCols;render();break;
    case 'col':{const k=t.dataset.k;if(ui.hidden.has(k))ui.hidden.delete(k);else ui.hidden.add(k);try{localStorage.setItem(LSC,JSON.stringify([...ui.hidden]));}catch(_){}render();break;}
    case 'new-cust':mNewCust();break;
    case 'import':mImport();break;
    case 'distribute':mDistribute();break;
    case 'reset-filters':resetF();render();break;
    case 'close-modal':closeModal();break;
    case 'fly':setFly(!fly.classList.contains('open'));break;
    case 'print':window.print();break;
    case 'backup':backup();break;
    case 'create-file':createFile();break;
    case 'open-file':openFile();break;
    case 'reconnect':reconnect();break;
    case 'disconnect':disconnect();break;
    case 'pick-restore':{const inp=document.getElementById('restore-file');if(inp){inp.value='';inp.click();}break;}
    case 'do-restore':if(pendingImport){applyState(pendingImport);pendingImport=null;closeModal();persist().then(()=>{toast('Sicherung geladen.');render();});}break;
    case 'choose-file':if(pendingFile){const f=pendingFile;pendingFile=null;closeModal();useFile(f.h,f.j);}break;
    case 'choose-local':if(pendingFile){const f=pendingFile;pendingFile=null;closeModal();useFile(f.h,null);}break;
    case 'wipe':if(armed(t,'Wirklich alle löschen?')){S.customers=[];persist();toast('Alle Kunden gelöscht.');}break;
    case 'export-all':exportCSV(sortList(S.customers),'kunden-alle-'+today()+'.csv');break;
    case 'qm-tab':ui.qmTab=t.dataset.v;render();break;
    case 'color-adv':patch('advisors',id,{colorIdx:+t.dataset.n});break;
    case 'del-adv':if(armed(t,'Wirklich entfernen?'))remove('advisors',id);break;
    case 'rm-examples':if(armed(t,'Wirklich entfernen?'))removeExamples();break;
    case 'del-cust':if(armed(t,'Wirklich löschen?')){remove('customers',id);toast('Kunde gelöscht.');go('kunden');}break;
    case 'copy':{const txt=t.dataset.t;const fb=()=>{const inp=document.getElementById(t.dataset.for);if(inp){inp.focus();inp.select();}toast('Link markiert. Kopiere ihn mit Strg+C oder Cmd+C.');};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Link kopiert.'),fb);}catch(_){fb();}break;}
    case 'export-kunden':exportCSV(sortList(filteredCust()),'kunden.csv');break;
    case 'export-one':if(c)exportCSV([c],'kunde-'+(c.lastName||'export').toLowerCase().replace(/[^a-z0-9äöüß]+/g,'-')+'.csv');break;
    case 'export-adv':{const a=M.adv.get(id);exportCSV(sortList(S.customers.filter(x=>x.advisorId===id)),'berater-'+(a?a.no:'')+'.csv');break;}
    case 'export-qm':exportCSV(S.customers.filter(x=>(!ui.qmAdv||(ui.qmAdv==='none'?!advOf(x):x.advisorId===ui.qmAdv))&&(!ui.qmEv||x.eventId===ui.qmEv)),'qm-liste.csv');break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.filter==='q'){ui.q=t.value;render();return;}
  if(t.id==='imp-names')updatePreview();
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.id==='restore-file'&&t.files&&t.files[0]){readRestore(t.files[0]);return;}
  if(t.id==='imp-file'&&t.files&&t.files[0]){
    const file=t.files[0],rd=enc=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result||''));fr.onerror=()=>r('');fr.readAsText(file,enc);});
    rd('utf-8').then(txt=>txt.includes(String.fromCharCode(65533))?rd('windows-1252'):txt).then(txt=>{const ta=document.getElementById('imp-names');if(ta){ta.value=txt;updatePreview();}});
    return;
  }
  if(t.dataset.filter&&t.dataset.filter!=='q'){ui[t.dataset.filter]=t.value;render();return;}
  if(!t.dataset.f||RO||route.v==='einsicht')return;
  const id=t.dataset.id,f=t.dataset.f;let v=t.value;
  if(t.dataset.col==='advisors'){v=v.trim();if(!v){render();return;}patch('advisors',id,{name:v});return;}
  const c=M.cust.get(id);if(!c)return;
  if(f==='qm'){setQM(c,v);return;}
  if(f==='attempts')v=Math.max(0,parseInt(v,10)||0);
  else if(typeof v==='string')v=v.trim();
  if((c[f]==null?'':c[f])===v)return;
  const p={};p[f]=v;patchCust(c,p,fieldLog(f,v));
});
document.addEventListener('focusout',e=>{if(pending&&e.target.hasAttribute&&e.target.hasAttribute('data-hold')){pending=false;setTimeout(render,0);}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!modal.hidden)closeModal();else if(fly.classList.contains('open')){setFly(false);const b=rail.querySelector('[data-act="fly"]');if(b)b.focus();}});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset||!f.dataset.form)return;
  e.preventDefault();if(RO)return;
  const kind=f.dataset.form,fdt=new FormData(f),id=f.dataset.id,g=k=>String(fdt.get(k)||'').trim();
  if(kind==='attendees')addAttendees(f);
  else if(kind==='distribute')doDistribute(f);
  else if(kind==='newcust'){
    const r={firstName:g('firstName'),lastName:g('lastName'),phone:g('phone'),email:g('email'),location:g('location'),eventInfo:g('eventInfo')};if(!r.firstName&&!r.lastName)return;
    const evId='',advId=g('advisorId'),d=newCust(r,evId,advId),nid=uid('c');
    if(advId)d.log.unshift({d:new Date().toISOString(),t:fieldLog('advisorId',advId)});
    closeModal();put('customers',nid,d).then(()=>go('kunde-'+nid));
  }else if(kind==='log'){
    const c=M.cust.get(id),txt=g('t');if(!c||!txt)return;
    f.reset();patchCust(c,{},txt);
  }else if(kind==='adv-new'){
    const name=g('name');if(!name)return;
    const no=Math.max(0,...S.advisors.map(a=>a.no||0))+1;
    put('advisors',uid('a'),{name:name,no:no,colorIdx:((no-1)%6)+1});f.reset();toast('Berater '+no+' angelegt.');
  }
});
window.addEventListener('hashchange',()=>{route=parseRoute();closeModal();setFly(false);render();window.scrollTo(0,0);});

/* ---------- boot ---------- */
const SEED_ADV=[{id:'adv-1',name:'Arthur Buchner',no:1,colorIdx:4},{id:'adv-2',name:'Deniz Daglar',no:2,colorIdx:3},{id:'adv-3',name:'Can Daglar',no:3,colorIdx:5}];
async function boot(){
  route=parseRoute();render();
  idb=await idbOpen();
  let j=await idbGet('state');
  if(!isKL(j)){try{const l=JSON.parse(localStorage.getItem(LS)||'null');if(isKL(l))j=l;}catch(e){}}
  if(isKL(j))applyState(j);
  else{S.advisors=SEED_ADV.map(a=>Object.assign({},a));S.customers=[];ingestAdv();}
  lastBackup=(await idbGet('lastBackup'))||'';
  try{if(navigator.storage&&navigator.storage.persist){persisted=await navigator.storage.persisted();if(!persisted&&(STANDALONE||!IOS))persisted=await navigator.storage.persist();}}catch(e){}
  const h=await idbGet('file');
  if(h&&FS){fileH=h;try{const p=await h.queryPermission({mode:'readwrite'});if(p==='granted'){ready=true;await reconnect();}else needReconnect=true;}catch(e){needReconnect=true;}}
  if(!idb)storeOk=false;
  ready=true;
  if(!isKL(j))await persist();
  render();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});
window.addEventListener('pagehide',flush);
window.addEventListener('beforeunload',e=>{if(saveT){flush();e.preventDefault();e.returnValue='';}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
</script>
